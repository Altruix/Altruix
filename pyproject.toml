[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altruix"
version = "0.2.0"
description = "A modern modular Telegram userbot and assistant framework powered by Telethon."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
    "telethon>=1.36.0",
    "cryptg>=0.4.0",
    "aiofiles>=23.0",
    "beautifulsoup4>=4.12",
    "certifi",
    "dnspython>=2.6",
    "httpx[http2]>=0.27",
    "markdown",
    "motor>=3.4",
    "pymongo>=4.7",
    "gtts>=2.5",
    "psutil>=5.9",
    "hachoir>=3.3",
    "cachetools>=5.3",
    "tinytag>=1.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "ujson>=5.9",
    "natsort>=8.4",
    "gitpython>=3.1",
    "pillow>=10.0",
    "ffmpeg-python>=0.2",
    "aiohttp-cors>=0.7",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Main*", "startup_scripts*"]

[tool.setuptools]
py-modules = ["style"]

[tool.setuptools.package-data]
Main = ["**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
